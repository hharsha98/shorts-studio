# Concept for Lucanet. Not an official Lucanet project. Before/after numbers are illustrative.
# Logo, colours and photos come from https://www.lucanet.com/. Do not mention a job advert.
# Proof card, safety badges and the closing card are added by the template.
version: 1
company:
  slug: lucanet
  name: Lucanet
  domain: lucanet.com
  logo_url: https://www.lucanet.com/content/experience-fragments/corporateweb/global/en/site/header/master/_jcr_content/root/image.coreimg.svg/1779298313496/logo-lucanet.svg
  logo_plate: light
  role: {en: AI Solutions Engineer, de: AI Solutions Engineer}
  brand:
    accent: "#9728FF"
    bgTop: "#071420"
    bgBottom: "#040C14"
  images:
    hook: https://www.lucanet.com/content/experience-fragments/corporateweb/global/en/site/fragments/tabs/tabs-benefits/tabs-homepage-platform-highlights/_jcr_content/root/tabs_copy/item_1732614236451/image.coreimg.png/1783092582492/data-architecture-610x541-2x.png
    pain: https://www.lucanet.com/content/experience-fragments/corporateweb/global/en/site/fragments/tabs/tabs-resources/Careers/_jcr_content/root/container/teaser_copy.coreimg.jpeg/1769165087264/blog-header-se-group-interview.jpeg
    idea: https://www.lucanet.com/content/experience-fragments/corporateweb/global/en/site/fragments/hero/hero-illustration/Hero-Illustration-Artificial-Intelligence/_jcr_content/root/teaser.coreimg.png/1788269572608/hero-image-artificial-intelligence-lume.png
