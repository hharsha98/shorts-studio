# Concept for Sportradar. Not an official Sportradar project. Before/after numbers are illustrative.
# Logo, colours and photos come from https://sportradar.com/. Do not mention a job advert.
# Proof card, safety badges and the closing card are added by the template.
version: 1
company:
  slug: sportradar
  name: Sportradar
  domain: sportradar.com
  logo_url: https://sportradar.com/wp-content/uploads/2023/02/Sportradar-Brand-Line_Color_Black.svg
  logo_plate: light
  brand:
    accent: "#FF0000"
    bgTop: "#00003C"
    bgBottom: "#0E122B"
  images:
    hook: https://sportradar.com/wp-content/uploads/2021/12/About-Us-Header-.jpg
    pain: https://sportradar.com/wp-content/uploads/2021/12/WHY-.jpg
    idea: https://sportradar.com/wp-content/uploads/2021/12/What-we-do.jpg

problems:
  - slug: department-to-live
    title: {en: Department to live, de: Von der Abteilung in den Betrieb}
    hook:
      icon: machine
      image: hook
      sub:
        en: Sit with the team. Find the problem. Ship the agent.
        de: Beim Team sitzen. Das Problem finden. Den Agenten live bringen.
      en:
        - [{text: "From the "}, {text: "department", accent: true}]
        - ["into a live agent"]
      de:
        - [{text: "Von der "}, {text: "Abteilung", accent: true}]
        - ["in einen live Agenten"]
    evidence:
      title:
        en: Three places the work sits
        de: Drei Stellen, an denen die Arbeit liegt
      note:
        en: A concept, not an official Sportradar project.
        de: Ein Konzept, kein offizielles Projekt von Sportradar.
      cards:
        - role: {en: Talk, de: Sprechen}
          quote:
            en: Sit with the unit and map the real workflow
            de: Bei der Einheit sitzen und den echten Ablauf aufnehmen
          gist: {en: People and process, de: Menschen und Prozess}
        - role: {en: Cut, de: Vereinfachen}
          quote:
            en: Break clutter into steps and say where AI helps
            de: Unklarheit in Schritte teilen und sagen, wo KI hilft
          gist: {en: Clear next step, de: Klarer nächster Schritt}
        - role: {en: Ship, de: Liefern}
          quote:
            en: RAG, tools, evaluations, then a live agent
            de: RAG, Werkzeuge, Evaluation, dann ein live Agent
          gist: {en: LangGraph · tests, de: LangGraph · Tests}
    pain:
      image: pain
      title:
        en: The later a use case stalls, the more it costs
        de: Je später ein Use-Case stockt, desto teurer wird er
      chips:
        en: [Talk, Prototype, Live]
        de: [Gespräch, Prototyp, Live]
      columns:
        en: [In the unit, In the build, In live ops]
        de: [In der Einheit, Im Bau, Im Betrieb]
      note:
        en: "Rule of ten: a general quality principle, not company data"
        de: "Zehnerregel: allgemeines Qualitätsprinzip, keine Unternehmensdaten"
    idea:
      icon: agent
      image: idea
      kicker: {en: One idea, de: Eine Idee}
      title:
        en: A forward-deployed agent
        de: Ein Agent in der Fachabteilung
      sub:
        en: Talk + RAG + evaluation in production
        de: Gespräch + RAG + Evaluation im Betrieb
    steps:
      - {id: talk, icon: inbox, link: arrow,
         title: {en: Sit with the unit, de: Bei der Einheit sitzen},
         sub: {en: "workflow · data", de: "Ablauf · Daten"}}
      - {id: agent, icon: agent, link: both,
         title: {en: Agentic RAG, de: Agentisches RAG},
         sub: {en: LangGraph · tools, de: LangGraph · Werkzeuge}}
      - {id: rules, icon: db, link: arrow,
         title: {en: Their systems, de: Ihre Systeme},
         sub: {en: APIs · knowledge, de: APIs · Wissen}}
      - {id: checks, icon: shield, link: arrow,
         title: {en: Eval + person, de: Eval + Mensch},
         sub: {en: "test sets · traces", de: "Testsätze · Traces"}}
      - {id: live, icon: factory,
         title: {en: In production, de: Im Produktivbetrieb},
         sub: {en: FastAPI · pipelines, de: FastAPI · Pipelines}}
    before_after:
      - label: {en: Weeks to first live use, de: Wochen bis zum ersten Live-Einsatz}
        before: 12
        after: 4
        unit: {en: wk, de: Wo.}
    pilot:
      en: ["One department", "Read-only first", "Measured with them"]
      de: ["Eine Abteilung", "Zuerst nur lesend", "Gemeinsam messen"]
    narration:
      en:
        - {scene: hook, text: "A use case dies if nobody sits with the department."}
        - {scene: evidence, text: "Talk, cut, ship: the work sits between those steps."}
        - {scene: pain, text: "Talk, prototype, live: a late stall costs the most.",
           cues: {pain.chips: Talk, pain.0: late, pain.1: stall, pain.2: costs}}
        - {scene: idea, text: "One idea: a forward-deployed agent I gather, build, and run with the team."}
        - {scene: arch, text: "I sit with the unit and map the real workflow.",
           cues: {arch.talk: sit}}
        - {scene: arch, text: "Then I build an agentic RAG system on their knowledge.",
           cues: {arch.agent: build, arch.rules: knowledge}}
        - {scene: arch, text: "It goes live with evaluations, traces, and a person who decides.",
           cues: {arch.checks: live, arch.live: evaluations, arch.badges: traces}}
        - {scene: metrics, text: "Illustrative targets: first live use from twelve weeks to four.",
           cues: {metrics.0: weeks}}
        - {scene: proof, text: "At Siemens in Amberg I built a multi-agent system with advanced RAG that cut root-cause analysis by 73 to 88 percent on 16 machines in production.",
           say: "At Siemens in Amberg I built a multi-agent system with advanced R-A-G that cut root-cause analysis by 73 to 88 percent on 16 machines in production.",
           cues: {proof: Siemens}}
        - {scene: pilot, text: "A first pilot could start with one department.",
           cues: {pilot.0: first, pilot.1: start, pilot.2: department}}
        - {scene: closing, text: "Happy to explore it with you."}
      de:
        - {scene: hook, text: "Ein Use-Case stirbt, wenn niemand in der Abteilung sitzt."}
        - {scene: evidence, text: "Sprechen, vereinfachen, liefern: dazwischen bleibt die Arbeit liegen."}
        - {scene: pain, text: "Gespräch, Prototyp, Live: ein spätes Stocken kostet am meisten.",
           cues: {pain.chips: Gespräch, pain.0: spätes, pain.1: Stocken, pain.2: kostet}}
        - {scene: idea, text: "Eine Idee: ein Agent in der Fachabteilung, den ich aufnehme, baue und mit dem Team betreibe."}
        - {scene: arch, text: "Ich sitze bei der Einheit und nehme den echten Ablauf auf.",
           cues: {arch.talk: sitze}}
        - {scene: arch, text: "Dann baue ich ein agentisches RAG-System auf ihrem Wissen.",
           cues: {arch.agent: baue, arch.rules: Wissen}}
        - {scene: arch, text: "Es geht live mit Evaluation, Traces und einem Menschen, der entscheidet.",
           cues: {arch.checks: live, arch.live: Evaluation, arch.badges: Traces}}
        - {scene: metrics, text: "Beispielhafte Ziele: erster Live-Einsatz von zwölf auf vier Wochen.",
           cues: {metrics.0: Wochen}}
        - {scene: proof, text: "Bei Siemens in Amberg habe ich ein Multi-Agenten-System mit Advanced RAG gebaut, das die Ursachenanalyse um 73 bis 88 Prozent verkürzt, an 16 Maschinen im Produktivbetrieb.",
           say: "Bei Siemens in Amberg habe ich ein Multi-Agenten-System mit Advanced R-A-G gebaut, das die Ursachenanalyse um 73 bis 88 Prozent verkürzt, an 16 Maschinen im Produktivbetrieb.",
           cues: {proof: Siemens}}
        - {scene: pilot, text: "Ein erster Pilot könnte mit einer Abteilung starten.",
           cues: {pilot.0: erster, pilot.1: starten, pilot.2: Abteilung}}
        - {scene: closing, text: "Mehr dazu gern im Gespräch."}
