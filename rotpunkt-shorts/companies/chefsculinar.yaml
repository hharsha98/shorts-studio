# CHEFS CULINAR — suggest a substitute before a short item leaves on the delivery run.
# Photos are from the public international site; chefsculinar.de refused the fetch.
version: 1
company:
  slug: chefsculinar
  name: CHEFS CULINAR
  domain: chefsculinar.com
  logo_url: https://www.chefsculinar.com/img/logocc.svg
  logo_plate: light
  images:
    hook: https://www.chefsculinar.com/img/2017-04-10-GemueseSorten-690.jpg
    pain: https://www.chefsculinar.com/img/2017-04-20-LKW-690.jpg
    idea: https://www.chefsculinar.com/2020-01-16-LKW-Hafen-800x533.jpg

problems:
  - slug: ersatzartikel
    title: {de: Ersatzvorschlag}
    hook:
      icon: order
      image: hook
      sub: {de: Einen passenden Ersatz vorschlagen, bevor die Lieferung losfährt}
      de:
        - [{text: "Fehlartikel", accent: true}, {text: " fangen"}]
        - ["vor der Tour"]
    pain:
      image: pain
      title: {de: Je später ein Fehlartikel auffällt, desto teurer wird die Tour}
      chips: {de: [Mengen, Saison, Alternativen]}
      columns: {de: [In der Bestellung, Im Lager, In der Küche]}
      note: {de: "Zehnerregel: allgemeines Qualitätsprinzip, keine Unternehmensdaten"}
    idea:
      icon: agent
      image: idea
      title: {de: Assistent für Ersatzartikel}
      sub: {de: Prognose + Ihr Sortiment + Freigabe durch Menschen}
    steps:
      - {id: inputs, icon: inbox, link: arrow,
         title: {de: Bestellung der Küche},
         sub: {de: Menge, Termin, Standort}}
      - {id: agent, icon: agent, link: both,
         title: {de: Prognose},
         sub: {de: was knapp wird}}
      - {id: rules, icon: db, link: arrow,
         title: {de: Ihr Sortiment},
         sub: {de: passende Alternativen}}
      - {id: checks, icon: shield, link: arrow,
         title: {de: Vorschlag + Mensch},
         sub: {de: jeder Vorschlag mit Quelle}}
      - {id: erp, icon: check,
         title: {de: Auf die Tour},
         sub: {de: nur bestätigte Positionen}}
    before_after:
      - label: {de: Zeit für einen Ersatz}
        before: 12
        after: 2
        unit: {de: "Min."}
      - label: {de: "Fehlartikel auf der Tour (Index)"}
        before: 100
        after: 40
        unit: ""
    pilot:
      de: ["Eine Warengruppe", "Nur lesend, parallel zum Team", "Erfolg gemeinsam mit dem Fachbereich messen"]
    narration:
      de:
        - {scene: hook, text: "Ein Fehlartikel kostet in der Bestellung wenig und auf der Tour viel."}
        - {scene: pain, text: "Mengen, Saison, Alternativen: Ein leeres Fach heißt Ersatzsuche.",
           cues: {pain.chips: Mengen, pain.0: leeres, pain.1: Fach, pain.2: Ersatzsuche}}
        - {scene: idea, text: "Eine Idee: ein Assistent für Ersatzartikel."}
        - {scene: arch, text: "Er liest die Bestellung der Küche, mit Menge, Termin und Standort.",
           cues: {arch.inputs: liest}}
        - {scene: arch, text: "Eine Prognose erkennt, was knapp wird, und sucht im Sortiment.",
           cues: {arch.agent: Prognose, arch.rules: Sortiment}}
        - {scene: arch, text: "Vorschläge werden mit Quelle markiert, die Entscheidung trifft der Mensch.",
           cues: {arch.checks: Vorschläge}}
        - {scene: arch, text: "Nur bestätigte Positionen gehen auf die Tour, mit lokalen Modellen und der DSGVO im Blick.",
           cues: {arch.erp: bestätigte, arch.badges: lokalen}}
        - {scene: metrics, text: "Beispielhafte Pilotziele: Zeit für einen Ersatz von zwölf auf zwei Minuten, deutlich weniger Fehlartikel auf der Tour.",
           cues: {metrics.0: Zeit, metrics.1: deutlich}}
        - {scene: proof, text: "Ein Multi-Agenten-System mit LangGraph, das ich bei Siemens gebaut habe, läuft bereits produktiv in Amberg.",
           say: "Ein Multi-Agenten-System mit Lang-Graph, das ich bei Siemens gebaut habe, läuft bereits produktiv in Amberg.",
           cues: {proof: LangGraph}}
        - {scene: pilot, text: "Ein Pilot könnte mit einer Warengruppe starten.",
           cues: {pilot.0: Pilot, pilot.1: könnte, pilot.2: Warengruppe}}
        - {scene: closing, text: "Mehr dazu gern im Gespräch."}
