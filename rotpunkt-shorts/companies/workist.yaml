# Worked example: a concept, not an official project. Figures are illustrative.
# Workist — map a customer's documents onto ERP fields before the process goes live.
# The public logo SVG is inlined in the site header; the CDN file returns 403.
version: 1
company:
  slug: workist
  name: Workist
  domain: workist.com
  logo_url: local:companies/logos/workist.svg
  images:
    hook: https://cdn.prod.website-files.com/6655c0bc50bcd09c9f042af4/66f4dfcc3a2eb94770bd7331_hero_1.webp
    pain: https://cdn.prod.website-files.com/664d86b19069e771ae4687a4/66f4dc0b8b53a8e28614660f_blog%20people%20in%20front%20of%20desktop.webp
    idea: https://cdn.prod.website-files.com/6655c0bc50bcd09c9f042af4/67bcab58b85b4e175624d294_Frame-83251%20(1).webp

problems:
  - slug: anbindung
    title: {de: Anbindung}
    hook:
      icon: order
      image: hook
      sub: {de: Ein Kundenprozess anbinden, bevor er live geht}
      de:
        - [{text: "Felder", accent: true}, {text: " zuordnen"}]
        - ["vor dem Start"]
    pain:
      image: pain
      title: {de: Je später eine Zuordnung offen bleibt, desto später der erste Lauf}
      chips: {de: [Felder, Stammdaten, Ausnahmen]}
      columns: {de: [Im Beleg, In der Zuordnung, Im System]}
      note: {de: "Zehnerregel: allgemeines Qualitätsprinzip, keine Unternehmensdaten"}
    idea:
      icon: agent
      image: idea
      title: {de: Assistent für die Anbindung}
      sub: {de: KI-Agent + Zielfelder + Freigabe durch Menschen}
    steps:
      - {id: inputs, icon: inbox, link: arrow,
         title: {de: Belege des Kunden},
         sub: {de: Bestellung oder Rechnung}}
      - {id: agent, icon: agent, link: both,
         title: {de: "KI-Agent (LLM)"},
         sub: {de: liest die Felder}}
      - {id: rules, icon: db, link: arrow,
         title: {de: Zielfelder im ERP},
         sub: {de: Stammdaten und Regeln}}
      - {id: checks, icon: shield, link: arrow,
         title: {de: Unsicher + Mensch},
         sub: {de: jede Stelle mit Quelle}}
      - {id: erp, icon: check,
         title: {de: In den laufenden Prozess},
         sub: {de: nur bestätigte Zuordnungen}}
    before_after:
      - label: {de: Tage bis zum ersten Lauf}
        before: 10
        after: 3
        unit: {de: Tage}
      - label: {de: "Offene Ausnahmen (Index)"}
        before: 100
        after: 30
        unit: ""
    pilot:
      de: ["Ein Dokumententyp", "Nur lesend, parallel zum Team", "Erfolg gemeinsam mit dem Kunden messen"]
    narration:
      de:
        - {scene: hook, text: "Die letzte Meile entscheidet, ob ein Prozess wirklich live geht."}
        - {scene: pain, text: "Felder, Stammdaten, Ausnahmen: Eine offene Zuordnung hält den Start auf.",
           cues: {pain.chips: Felder, pain.0: offene, pain.1: Zuordnung, pain.2: Start}}
        - {scene: idea, text: "Eine Idee: ein Assistent für die Anbindung."}
        - {scene: arch, text: "Er liest die Belege des Kunden, Bestellung oder Rechnung.",
           cues: {arch.inputs: liest}}
        - {scene: arch, text: "Ein KI-Agent ordnet die Felder den Zielen im ERP zu.",
           say: "Ein K-I-Agent ordnet die Felder den Zielen im E-R-P zu.",
           cues: {arch.agent: KI-Agent, arch.rules: Zielen}}
        - {scene: arch, text: "Unsichere Stellen werden mit Quelle markiert, die Entscheidung trifft der Mensch.",
           cues: {arch.checks: Unsichere}}
        - {scene: arch, text: "Nur bestätigte Zuordnungen gehen in den laufenden Prozess, mit lokalen Modellen und der DSGVO im Blick.",
           cues: {arch.erp: bestätigte, arch.badges: lokalen}}
        - {scene: metrics, text: "Beispielhafte Pilotziele: Zeit bis zum ersten Lauf von zehn auf drei Tage, deutlich weniger offene Ausnahmen.",
           cues: {metrics.0: Zeit, metrics.1: deutlich}}
        - {scene: proof, text: "Ein Multi-Agenten-System mit LangGraph, das ich bei Siemens gebaut habe, läuft bereits produktiv in Amberg.",
           say: "Ein Multi-Agenten-System mit Lang-Graph, das ich bei Siemens gebaut habe, läuft bereits produktiv in Amberg.",
           cues: {proof: LangGraph}}
        - {scene: pilot, text: "Ein Pilot könnte mit einem Dokumententyp starten.",
           cues: {pilot.0: Pilot, pilot.1: könnte, pilot.2: Dokumententyp}}
        - {scene: closing, text: "Mehr dazu gern im Gespräch."}
