# PlanD — check recorded cleaning shifts against the plan before payroll and invoicing.
version: 1
company:
  slug: pland
  name: PlanD
  domain: pland.app
  logo_url: https://cdn.prod.website-files.com/6ab239e9ad1dd25a9548f13c/6ab239e9ad1dd25a9548f556_Pland%20Logo%202026.png
  logo_plate: light
  images:
    hook: https://cdn.prod.website-files.com/6ab239e9ad1dd25a9548f13c/6ab2559171ee4e55b69e377f_pd-home-branche-gebaeudereinigung.png
    pain: https://cdn.prod.website-files.com/6ab239e9ad1dd25a9548f13c/6ab254b7299b6cb2c145345a_Hero-1-optimized.png
    idea: https://cdn.prod.website-files.com/6ab239e9ad1dd25a9548f13c/6ab25524e426cedcb330ba0e_pd-home-funktion-einsatzplanung.png

problems:
  - slug: einsatzzeiten
    title: {de: Einsatzzeiten}
    hook:
      icon: order
      image: hook
      sub: {de: Einsatzzeiten gegen den Plan halten, bevor die Rechnung rausgeht}
      de:
        - [{text: "Zeiten", accent: true}, {text: " prüfen"}]
        - ["vor der Rechnung"]
    pain:
      image: pain
      title: {de: Je später eine falsche Zeit auffällt, desto teurer wird die Abrechnung}
      chips: {de: [Objekte, Schichten, Stunden]}
      columns: {de: [Im Plan, Auf dem Objekt, In der Abrechnung]}
      note: {de: "Zehnerregel: allgemeines Qualitätsprinzip, keine Unternehmensdaten"}
    idea:
      icon: agent
      image: idea
      title: {de: Assistent für die Einsatzzeiten}
      sub: {de: KI-Agent + Ihre Regeln + Freigabe durch Menschen}
    steps:
      - {id: inputs, icon: inbox, link: arrow,
         title: {de: Plan und erfasste Zeiten},
         sub: {de: Objekt, Schicht, Stunden}}
      - {id: agent, icon: agent, link: both,
         title: {de: "KI-Agent (LLM)"},
         sub: {de: vergleicht Plan und Ist}}
      - {id: rules, icon: db, link: arrow,
         title: {de: Ihre Regeln},
         sub: {de: Objekt, Schicht, Zuschläge}}
      - {id: checks, icon: shield, link: arrow,
         title: {de: Abweichung + Mensch},
         sub: {de: jede Abweichung mit Quelle}}
      - {id: erp, icon: check,
         title: {de: Lohn und Rechnung},
         sub: {de: nur geprüfte Zeiten}}
    before_after:
      - label: {de: Prüfzeit pro Abrechnungslauf}
        before: 20
        after: 5
        unit: {de: "Min."}
      - label: {de: "Korrekturen in der Abrechnung (Index)"}
        before: 100
        after: 30
        unit: ""
    pilot:
      de: ["Ein Betrieb", "Nur lesend, parallel zum Team", "Erfolg gemeinsam mit dem Fachbereich messen"]
    narration:
      de:
        - {scene: hook, text: "Eine falsche Einsatzzeit kostet in der Planung wenig und in der Abrechnung viel."}
        - {scene: pain, text: "Objekte, Schichten, Stunden: Eine Lücke heißt Nacharbeit.",
           cues: {pain.chips: Objekte, pain.0: Lücke, pain.1: heißt, pain.2: Nacharbeit}}
        - {scene: idea, text: "Eine Idee: ein Assistent für die Einsatzzeiten."}
        - {scene: arch, text: "Er liest den Einsatzplan und die erfassten Zeiten.",
           cues: {arch.inputs: liest}}
        - {scene: arch, text: "Ein KI-Agent vergleicht sie mit Ihren Regeln zu Objekt und Schicht.",
           say: "Ein K-I-Agent vergleicht sie mit Ihren Regeln zu Objekt und Schicht.",
           cues: {arch.agent: KI-Agent, arch.rules: Regeln}}
        - {scene: arch, text: "Abweichungen werden mit Quelle markiert, die Entscheidung trifft der Mensch.",
           cues: {arch.checks: Abweichungen}}
        - {scene: arch, text: "Nur geprüfte Zeiten gehen in Lohn und Rechnung, mit lokalen Modellen und der DSGVO im Blick.",
           cues: {arch.erp: geprüfte, arch.badges: lokalen}}
        - {scene: metrics, text: "Beispielhafte Pilotziele: Prüfzeit von zwanzig auf fünf Minuten, deutlich weniger Korrekturen in der Abrechnung.",
           cues: {metrics.0: Prüfzeit, metrics.1: deutlich}}
        - {scene: proof, text: "Ein Multi-Agenten-System mit LangGraph, das ich bei Siemens gebaut habe, läuft bereits produktiv in Amberg.",
           say: "Ein Multi-Agenten-System mit Lang-Graph, das ich bei Siemens gebaut habe, läuft bereits produktiv in Amberg.",
           cues: {proof: LangGraph}}
        - {scene: pilot, text: "Ein Pilot könnte mit einem Betrieb starten.",
           cues: {pilot.0: Pilot, pilot.1: könnte, pilot.2: Betrieb}}
        - {scene: closing, text: "Mehr dazu gern im Gespräch."}
