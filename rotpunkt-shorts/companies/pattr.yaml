# pattr — draft an answer to a municipal-utility portal message, with the source, human sends it.
version: 1
company:
  slug: pattr
  name: pattr
  domain: pattr.de
  logo_url: local:companies/logos/pattr.svg
  logo_plate: light
  images:
    hook: https://pattr.de/_Resources/Persistent/9/3/9/5/9395c781d4b2d281fdcee21c70433d1058b8ec39/220107_pattr_collagen_30.1-1472x1299.png
    pain: https://pattr.de/_Resources/Persistent/f/b/3/1/fb31b6bfffef1e4b7880d697f483159c26539a1c/Vimeo-595367045.jpg
    idea: https://pattr.de/_Resources/Persistent/e/a/3/5/ea35e3c022d242d64d95b70790d1e6194f607e8c/v-check-1860x1541.png

problems:
  - slug: kundenanfragen
    title: {de: Kundenanfragen}
    hook:
      icon: knowledge
      image: hook
      sub: {de: Eine Portalnachricht beantworten, bevor sie in der Warteschlange liegt}
      de:
        - [{text: "Kundenfragen", accent: true}]
        - ["mit Quelle"]
    pain:
      image: pain
      title: {de: Je später eine Anfrage liegen bleibt, desto mehr Anrufe folgen}
      chips: {de: [Verträge, Tarife, Umzüge]}
      columns: {de: [Im Portal, Im Service, Beim Kunden]}
      note: {de: "Zehnerregel: allgemeines Qualitätsprinzip, keine Unternehmensdaten"}
    idea:
      icon: agent
      image: idea
      title: {de: Assistent für Kundenanfragen}
      sub: {de: KI-Agent + Ihr Wissen + Freigabe durch Menschen}
    steps:
      - {id: inputs, icon: inbox, link: arrow,
         title: {de: Nachricht aus dem Portal},
         sub: {de: Vertrag, Tarif, Umzug}}
      - {id: agent, icon: agent, link: both,
         title: {de: "KI-Agent (LLM)"},
         sub: {de: versteht das Anliegen}}
      - {id: rules, icon: db, link: arrow,
         title: {de: Ihr Wissen},
         sub: {de: Produkte und Prozesse}}
      - {id: checks, icon: shield, link: arrow,
         title: {de: Entwurf + Mensch},
         sub: {de: jede Aussage mit Quelle}}
      - {id: erp, icon: check,
         title: {de: Antwort an den Kunden},
         sub: {de: nur freigegebene Texte}}
    before_after:
      - label: {de: Zeit für den Erstentwurf}
        before: 15
        after: 3
        unit: {de: "Min."}
      - label: {de: "Rückfragen (Index)"}
        before: 100
        after: 35
        unit: ""
    pilot:
      de: ["Ein Produkt", "Nur lesend, parallel zum Team", "Erfolg gemeinsam mit dem Fachbereich messen"]
    narration:
      de:
        - {scene: hook, text: "Eine Kundenfrage, die liegen bleibt, wird schnell zum Anruf."}
        - {scene: pain, text: "Verträge, Tarife, Umzüge: Ohne Antwort stockt der Vorgang.",
           cues: {pain.chips: Verträge, pain.0: Ohne, pain.1: Antwort, pain.2: stockt}}
        - {scene: idea, text: "Eine Idee: ein Assistent für Kundenanfragen."}
        - {scene: arch, text: "Er liest die Nachricht aus dem Portal, ob Vertrag, Tarif oder Umzug.",
           cues: {arch.inputs: liest}}
        - {scene: arch, text: "Ein KI-Agent versteht das Anliegen und sucht in Ihrem Wissen.",
           say: "Ein K-I-Agent versteht das Anliegen und sucht in Ihrem Wissen.",
           cues: {arch.agent: KI-Agent, arch.rules: Wissen}}
        - {scene: arch, text: "Der Entwurf kommt mit Quelle, die Freigabe trifft der Mensch.",
           cues: {arch.checks: Entwurf}}
        - {scene: arch, text: "Nur freigegebene Texte gehen an den Kunden, mit lokalen Modellen und der DSGVO im Blick.",
           cues: {arch.erp: freigegebene, arch.badges: lokalen}}
        - {scene: metrics, text: "Beispielhafte Pilotziele: Erstentwurf von fünfzehn auf drei Minuten, deutlich weniger Rückfragen.",
           cues: {metrics.0: Erstentwurf, metrics.1: deutlich}}
        - {scene: proof, text: "Die gleichen Bausteine laufen bereits produktiv bei Siemens in Amberg.",
           cues: {proof: gleichen}}
        - {scene: pilot, text: "Ein Pilot könnte mit einem Produkt starten.",
           cues: {pilot.0: Pilot, pilot.1: könnte, pilot.2: Produkt}}
        - {scene: closing, text: "Mehr dazu gern im Gespräch."}
