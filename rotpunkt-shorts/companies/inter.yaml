# INTER Krankenversicherung — first look at incoming benefit documents, human still decides.
version: 1
company:
  slug: inter
  name: INTER
  domain: inter.de
  logo_url: https://www.inter.de/typo3conf/ext/inter/Resources/Public/Images/inter-brand-100.svg
  images:
    hook: https://www.inter.de/fileadmin/_processed_/2/8/csm_selbststaendige-angestellte-social_66b17a251b.jpg
    pain: https://www.inter.de/fileadmin/_processed_/a/5/csm_private-krankenversicherung-fuer-beamte-mainvisual_a3e28a24f8.jpg
    idea: https://www.inter.de/fileadmin/_processed_/3/e/csm_GettyImages-565889305_1920x600%402x_ee3c9436d8.webp

problems:
  - slug: belegpruefung
    title: {de: Belegprüfung}
    hook:
      icon: order
      image: hook
      sub: {de: Einen Leistungsbeleg einordnen, bevor die Sachbearbeitung beginnt}
      de:
        - [{text: "Belege", accent: true}, {text: " einordnen"}]
        - ["bevor sie warten"]
    pain:
      image: pain
      title: {de: Je später ein Beleg hängen bleibt, desto länger wartet der Mensch}
      chips: {de: [Rechnungen, Tarife, Nachweise]}
      columns: {de: [Am Eingang, In der Prüfung, Beim Kunden]}
      note: {de: "Zehnerregel: allgemeines Qualitätsprinzip, keine Unternehmensdaten"}
    idea:
      icon: agent
      image: idea
      title: {de: Assistent für die Belegprüfung}
      sub: {de: KI-Agent + Ihre Tarifregeln + Freigabe durch Menschen}
    steps:
      - {id: inputs, icon: inbox, link: arrow,
         title: {de: Eingehender Beleg},
         sub: {de: "PDF · Scan · Portal"}}
      - {id: agent, icon: agent, link: both,
         title: {de: "KI-Agent (LLM)"},
         sub: {de: erfasst die Felder}}
      - {id: rules, icon: db, link: arrow,
         title: {de: Ihre Tarifregeln},
         sub: {de: was der Vertrag hergibt}}
      - {id: checks, icon: shield, link: arrow,
         title: {de: Unklarheit + Mensch},
         sub: {de: jede Stelle mit Quelle}}
      - {id: erp, icon: check,
         title: {de: Weiter im Bestand},
         sub: {de: nur freigegebene Belege}}
    before_after:
      - label: {de: Zeit für die Erstsicht}
        before: 20
        after: 5
        unit: {de: "Min."}
      - label: {de: "Rückläufer (Index)"}
        before: 100
        after: 30
        unit: ""
    pilot:
      de: ["Eine Belegart", "Nur lesend, parallel zum Team", "Erfolg gemeinsam mit dem Fachbereich messen"]
    narration:
      de:
        - {scene: hook, text: "Ein Leistungsbeleg, der liegen bleibt, verlängert die Wartezeit."}
        - {scene: pain, text: "Rechnungen, Tarife, Nachweise: Eine Unklarheit heißt Rückfrage.",
           cues: {pain.chips: Rechnungen, pain.0: Unklarheit, pain.1: heißt, pain.2: Rückfrage}}
        - {scene: idea, text: "Eine Idee: ein Assistent für die Belegprüfung."}
        - {scene: arch, text: "Er liest jeden eingehenden Beleg, als PDF, als Scan oder aus dem Portal.",
           cues: {arch.inputs: liest}}
        - {scene: arch, text: "Ein KI-Agent erfasst die Felder und prüft sie gegen Ihre Tarifregeln.",
           say: "Ein K-I-Agent erfasst die Felder und prüft sie gegen Ihre Tarifregeln.",
           cues: {arch.agent: KI-Agent, arch.rules: Tarifregeln}}
        - {scene: arch, text: "Unklarheiten werden mit Quelle markiert, die Entscheidung trifft der Mensch.",
           cues: {arch.checks: Unklarheiten}}
        - {scene: arch, text: "Nur freigegebene Belege gehen weiter, mit lokalen Modellen und der DSGVO im Blick.",
           cues: {arch.erp: freigegebene, arch.badges: lokalen}}
        - {scene: metrics, text: "Beispielhafte Pilotziele: Erstsicht von zwanzig auf fünf Minuten, deutlich weniger Rückläufer.",
           cues: {metrics.0: Erstsicht, metrics.1: deutlich}}
        - {scene: proof, text: "Ein Multi-Agenten-System mit LangGraph, das ich bei Siemens gebaut habe, läuft bereits produktiv in Amberg.",
           say: "Ein Multi-Agenten-System mit Lang-Graph, das ich bei Siemens gebaut habe, läuft bereits produktiv in Amberg.",
           cues: {proof: LangGraph}}
        - {scene: pilot, text: "Ein Pilot könnte mit einer Belegart starten.",
           cues: {pilot.0: Pilot, pilot.1: könnte, pilot.2: Belegart}}
        - {scene: closing, text: "Mehr dazu gern im Gespräch."}
