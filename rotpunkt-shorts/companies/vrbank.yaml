# VR Bank RheinAhrEifel — check a customer file for completeness before a person decides.
version: 1
company:
  slug: vrbank
  name: VR Bank RheinAhrEifel
  domain: vr-rheinahreifel.de
  logo_url: https://atruvia.scene7.com/is/image/atruvia/Logo-Homebutton_Website?fmt=png-alpha&wid=800
  images:
    hook: https://atruvia.scene7.com/is/image/atruvia/20260601_Genossenschaftliche%20Beratung_3000x2000px?wid=1600&fmt=jpg
    pain: https://atruvia.scene7.com/is/image/atruvia/baufinanzierung-vrnw-visual-teaser-1290x860-1?wid=1290&fmt=jpg
    idea: https://atruvia.scene7.com/is/image/atruvia/unternehmerkredit-vrnw-visual-teaser-1290x860?wid=1290&fmt=jpg

problems:
  - slug: vorgangsakten
    title: {de: Vorgangsakten}
    hook:
      icon: order
      image: hook
      sub: {de: Eine Kundenakte prüfen, bevor entschieden wird}
      de:
        - [{text: "Akten", accent: true}, {text: " prüfen"}]
        - ["vor der Zusage"]
    pain:
      image: pain
      title: {de: Je später eine Lücke auffällt, desto länger wartet die Entscheidung}
      chips: {de: [Nachweise, Verträge, Auszüge]}
      columns: {de: [Am Eingang, In der Prüfung, Bei der Entscheidung]}
      note: {de: "Zehnerregel: allgemeines Qualitätsprinzip, keine Unternehmensdaten"}
    idea:
      icon: agent
      image: idea
      title: {de: Assistent für die Aktenprüfung}
      sub: {de: KI-Agent + Ihre Checkliste + Freigabe durch Menschen}
    steps:
      - {id: inputs, icon: inbox, link: arrow,
         title: {de: Eingehende Unterlagen},
         sub: {de: "PDF · Scan · Vorgang"}}
      - {id: agent, icon: agent, link: both,
         title: {de: "KI-Agent (LLM)"},
         sub: {de: ordnet die Dokumente ein}}
      - {id: rules, icon: db, link: arrow,
         title: {de: Ihre Checkliste},
         sub: {de: was zum Vorgang gehört}}
      - {id: checks, icon: shield, link: arrow,
         title: {de: Lücken + Mensch},
         sub: {de: jede Lücke mit Quelle}}
      - {id: erp, icon: check,
         title: {de: Zur Entscheidung},
         sub: {de: nur vollständige Akten}}
    before_after:
      - label: {de: Prüfzeit pro Akte}
        before: 35
        after: 8
        unit: {de: "Min."}
      - label: {de: "Nachforderungen (Index)"}
        before: 100
        after: 30
        unit: ""
    pilot:
      de: ["Eine Vorgangsart", "Nur lesend, parallel zum Team", "Erfolg gemeinsam mit dem Fachbereich messen"]
    narration:
      de:
        - {scene: hook, text: "Eine unvollständige Kundenakte kostet am Schalter wenig und in der Entscheidung viel."}
        - {scene: pain, text: "Nachweise, Verträge, Auszüge: Eine Lücke heißt Rückfrage und Verzug.",
           cues: {pain.chips: Nachweise, pain.0: Lücke, pain.1: Rückfrage, pain.2: Verzug}}
        - {scene: idea, text: "Eine Idee: ein Assistent für die Aktenprüfung."}
        - {scene: arch, text: "Er liest die eingehenden Unterlagen, als PDF oder aus dem Vorgang.",
           cues: {arch.inputs: liest}}
        - {scene: arch, text: "Ein KI-Agent ordnet sie ein und prüft sie gegen Ihre Checkliste.",
           say: "Ein K-I-Agent ordnet sie ein und prüft sie gegen Ihre Checkliste.",
           cues: {arch.agent: KI-Agent, arch.rules: Checkliste}}
        - {scene: arch, text: "Lücken werden mit Quelle markiert, die Entscheidung trifft der Mensch.",
           cues: {arch.checks: Lücken}}
        - {scene: arch, text: "Nur vollständige Akten gehen zur Entscheidung, mit lokalen Modellen und der DSGVO im Blick.",
           cues: {arch.erp: vollständige, arch.badges: lokalen}}
        - {scene: metrics, text: "Beispielhafte Pilotziele: Prüfzeit von fünfunddreißig auf acht Minuten, deutlich weniger Nachforderungen.",
           cues: {metrics.0: Prüfzeit, metrics.1: deutlich}}
        - {scene: proof, text: "Ein Multi-Agenten-System mit LangGraph, das ich bei Siemens gebaut habe, läuft bereits produktiv in Amberg.",
           say: "Ein Multi-Agenten-System mit Lang-Graph, das ich bei Siemens gebaut habe, läuft bereits produktiv in Amberg.",
           cues: {proof: LangGraph}}
        - {scene: pilot, text: "Ein Pilot könnte mit einer Vorgangsart starten.",
           cues: {pilot.0: Pilot, pilot.1: könnte, pilot.2: Vorgangsart}}
        - {scene: closing, text: "Mehr dazu gern im Gespräch."}
